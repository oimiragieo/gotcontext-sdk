[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gotcontext"
version = "0.5.0"
description = "Python SDK for the gotcontext.ai semantic compression API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "gotcontext.ai" }]
keywords = ["gotcontext", "compression", "llm", "tokens", "semantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://gotcontext.ai"
Documentation = "https://gotcontext.ai/docs"
Repository = "https://github.com/gotcontext/gotcontext-python"

[tool.hatch.build.targets.wheel]
packages = ["gotcontext"]
